name = "idiom-quest"
compatibility_date = "2025-01-01"
pages_build_output_dir = "./dist"

# ---- D1 資料庫（排行榜功能需要）----
# 1. 建立資料庫：  pnpm exec wrangler d1 create idiom-quest-db
# 2. 把輸出的 database_id 貼到下面，並取消下面 4 行的註解
# 3. 套用資料表：  pnpm db:migrate:remote
# [[d1_databases]]
# binding = "DB"
# database_name = "idiom-quest-db"
# database_id = "貼上你的 database_id"
# migrations_dir = "migrations"

# 老師後台密碼請在 Cloudflare 儀表板（Settings > Variables and Secrets）
# 新增名為 ADMIN_PASSWORD 的 Secret；本機開發寫在 .dev.vars（已加入 .gitignore）。
